<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoramento IoT</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="sidebar">
    <div class="logo">BAG INTELIGENTE</div>
    <ul>
        <li id="nav-dashboard" class="nav-ativo" onclick="mostrarPagina('dashboard')">
            <i class="fa-solid fa-gauge-high"></i> Visão Geral
        </li>
        <li id="nav-historico" onclick="mostrarPagina('historico')">
            <i class="fa-solid fa-chart-area"></i> Gráficos
        </li>

        <!-- ── SELEÇÃO DE PRODUTO ── -->
        <div class="card" style="margin-top:20px;">
            <i class="fa-solid fa-box-open" style="color:#00bfff;font-size:1.5rem;"></i>
            <h3>Produto</h3>
            <div class="produto-btns">
                <button id="btn-refrigerante" class="btn-produto ativo" onclick="selecionarProduto('refrigerante')">🥤 Refrigerante</button>
                <button id="btn-acai"         class="btn-produto"       onclick="selecionarProduto('acai')">🍧 Açaí</button>
                <button id="btn-pizza"        class="btn-produto"       onclick="selecionarProduto('pizza')">🍕 Pizza</button>
            </div>
        </div>

        <!-- ── STATUS ── -->
        <div class="card status-card" style="margin-top:15px;">
            <i id="icone-alerta" class="fa-solid fa-satellite-dish"></i>
            <h3>Status</h3>
            <span id="status-temp">---</span>
        </div>

        <!-- ── TELEGRAM FIXO CANTO INFERIOR DIREITO ── -->
        <div id="card-telegram" style="display:none;">
            <div class="telegram-compacto">
                <i class="fa-brands fa-telegram" id="icone-telegram"></i>
                <span id="status-telegram">NOTIFICANDO</span>
            </div>
        </div>

    </ul>
</div>

<div class="content">
    <div class="header">
        <h1 id="titulo-pagina">Visão Geral</h1>
        <div class="status">
            <span class="online"></span>
            ONLINE
        </div>
    </div>

    <!-- ── PÁGINA DASHBOARD ── -->
    <div id="pagina-dashboard">
        <div class="cards">

            <div class="card" id="card-temp">
                <i class="fa-solid fa-temperature-three-quarters"></i>
                <h3 id="label-produto">🥤 Refrigerante</h3>
                <span id="temp">--°C</span>
                <small id="tendencia-temp" style="font-size:1.8rem; font-weight:bold;">→</small>
            </div>

            <div class="card" id="card-liquido">
                <i class="fa-solid fa-droplet"></i>
                <h3>Líquido Detectado</h3>
                <span id="liquido">--%</span>
                <small id="status-liquido" style="font-size:0.85rem; display:block; margin-top:6px;">---</small>
            </div>

            <div class="card" id="card-vazamento">
                <i class="fa-solid fa-water"></i>
                <h3>Vazamento</h3>
                <span id="vazamento">---</span>
                <small id="ultimo-vazamento" style="font-size:0.75rem; color:#aaa; display:block; margin-top:6px;">Sem registros</small>
            </div>

            <div class="card" id="card-horario">
                <i class="fa-solid fa-clock"></i>
                <h3>Última Atualização</h3>
                <span id="horario">--:--:--</span>
            </div>

        </div>
    </div>

    <!-- ── PÁGINA GRÁFICOS ── -->
    <div id="pagina-historico" style="display:none">
        <div class="graficos-grid">
            <div class="grafico-box">
                <h2>Histórico de Temperatura</h2>
                <canvas id="grafico"></canvas>
            </div>
            <div class="grafico-box">
                <h2>Histórico de Líquido Detectado</h2>
                <canvas id="grafico-liquido"></canvas>
            </div>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
